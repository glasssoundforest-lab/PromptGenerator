[package]
name = "prompt_generator"
version = "0.9.0-beta"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wgpu", "default_fonts", "system_fonts", "clipboard", "links"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
# 実行ファイルを小さく速くする (起動時の読み込みも軽くなる)
lto = "thin"
codegen-units = 1
strip = true
